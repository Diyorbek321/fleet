# Local dev data services for Fleet Watch Pro.
# Brings dev to parity with the production stack (Postgres + Redis) so that
# Alembic migrations — which use Postgres-native constraint operations not
# supported by SQLite — run correctly.
#
#   docker compose up -d        # start Postgres + Redis
#   docker compose down         # stop (keeps data volume)
#   docker compose down -v      # stop and wipe data
services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5434:5432"
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - fleet_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fleet_pgdata:
  fleet_redisdata:
