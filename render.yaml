# Render Blueprint — provisions the whole Fleet Watch Pro stack in one place.
#
#   Postgres  +  Redis (Key Value)  +  FastAPI backend  +  static SPA frontend
#
# ── How to deploy ───────────────────────────────────────────────────────────
# 1. Push this repo to GitHub.
# 2. Render dashboard → New → Blueprint → pick this repo. Render reads this file
#    and creates every resource below.
# 3. Render auto-fills DATABASE_URL, REDIS_URL and a random JWT_SECRET_KEY.
#    You only fill the three `sync: false` values (they need the live URLs that
#    don't exist until the services are created):
#      • fleetwatch-api  → CORS_ORIGINS  = https://<your fleetwatch-web URL>
#      • fleetwatch-api  → GPS_API_KEYS  = comma-separated device keys you issue
#      • fleetwatch-web  → VITE_API_URL  = https://<your fleetwatch-api URL>
#      • fleetwatch-web  → VITE_WS_URL   = wss://<your fleetwatch-api URL>
# 4. Edit the frontend Content-Security-Policy `connect-src` below to your real
#    API origin (one line, marked CHANGE-ME) and redeploy the web service.
#
# Free Postgres on Render expires after ~30 days — use `starter` for anything
# real. The backend runs `alembic upgrade head` on every release (see its
# Dockerfile CMD), so migrations apply automatically.
# -----------------------------------------------------------------------------

databases:
  - name: fleetwatch-db
    plan: starter            # free tier expires in 30 days; starter is durable
    postgresMajorVersion: "16"

services:
  # ── Redis: refresh-token revocation, rate-limit store, scheduler lock ───────
  - type: keyvalue
    name: fleetwatch-redis
    plan: starter
    maxmemoryPolicy: noeviction   # never evict revoked tokens / locks
    ipAllowList: []               # only reachable from inside the Render network

  # ── FastAPI backend (Docker) ────────────────────────────────────────────────
  - type: web
    name: fleetwatch-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod                # flips on Redis, prod secret guard, CORS guard
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true        # Render generates a long random secret
      - key: DATABASE_URL
        fromDatabase:
          name: fleetwatch-db
          property: connectionString   # config.py coerces it to +asyncpg
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fleetwatch-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false                # set to the fleetwatch-web URL after first deploy
      - key: GPS_API_KEYS
        sync: false                # device ingestion keys you issue
      # Optional error tracking — paste a DSN to enable, leave unset to skip.
      - key: SENTRY_DSN
        sync: false

  # ── Frontend SPA (static site — no Docker, Vite build) ──────────────────────
  - type: web
    name: fleetwatch-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Vite bakes these into the bundle at build time. A change requires a
      # rebuild (Render does this automatically on env-var save).
      - key: VITE_API_URL
        sync: false                # https://<fleetwatch-api URL>
      - key: VITE_WS_URL
        sync: false                # wss://<fleetwatch-api URL>
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA history fallback
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /*
        name: Content-Security-Policy
        # CHANGE-ME: replace https://api.example.com / wss://api.example.com with
        # your real fleetwatch-api origin before going live.
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.example.com wss://api.example.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
