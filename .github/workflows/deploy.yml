name: Deploy

# Builds and pushes the backend + frontend container images to GitHub Container
# Registry (GHCR) on every push to main — AFTER CI passes.
#
# This is OFF by default. To enable it, set a repository variable
#   ENABLE_DEPLOY = true
# (Settings → Secrets and variables → Actions → Variables).
#
# Nothing here deploys. Production is a DigitalOcean Droplet that is updated by
# hand (see DEPLOY-DROPLET.md), so pushing to main never changes what customers
# are running. These images exist so that update can pull a prebuilt layer
# instead of compiling on a small-disk box.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Re-run the test suite as a gate so we never publish a broken image.
  ci:
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deliberately no deploy step. Production is updated by hand on the Droplet so
  # that a push can never restart the stack under a customer mid-shift, and so
  # that the person running a migration is watching when it runs.
  summary:
    needs: images
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish instructions
        run: |
          echo "Images published to GHCR:"
          echo "  ghcr.io/${{ github.repository }}-backend:${{ github.sha }}"
          echo "  ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}"
          echo
          echo "To roll these out, on the Droplet:"
          echo "  git pull && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build"
          echo
          echo "Take a backup first: ./scripts/backup.sh"
          echo "The backend runs 'alembic upgrade head' on start (backend/Dockerfile CMD)."
