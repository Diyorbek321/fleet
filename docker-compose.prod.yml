# Production stack for a single DigitalOcean Droplet (or any Docker host).
#
#   Caddy (auto-HTTPS)  →  web (SPA)  +  api (FastAPI)  →  Postgres + Redis
#
# Everything runs on one box; Postgres/Redis are NOT exposed to the internet
# (no published ports), only reachable on the internal compose network. Caddy
# is the only public entrypoint and provisions Let's Encrypt certificates
# automatically for both domains.
#
# Deploy:
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# The backend applies Alembic migrations on start (see backend/Dockerfile CMD).
# See DEPLOY-DROPLET.md for the full walkthrough.

name: fleetwatch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENV: prod
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env.prod}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleet}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN in .env.prod}
      GPS_API_KEYS: ${GPS_API_KEYS:-}
      # Raw position history is purged past this age by a background job — the
      # only thing standing between the droplet's disk and unbounded GPS growth.
      # Also caps how far back a leakage report can look; see .env.prod.example.
      GPS_HISTORY_RETENTION_DAYS: ${GPS_HISTORY_RETENTION_DAYS:-90}
      GPS_PURGE_BATCH_SIZE: ${GPS_PURGE_BATCH_SIZE:-10000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Optional. Expo's push endpoint accepts unauthenticated sends, so
      # notifications work without this; set it only if the Expo project has
      # "enhanced security" switched on, which then requires the header.
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Trip document storage: local disk on a persistent volume, served via
      # signed /api/files URLs. API_PUBLIC_URL makes those links absolute.
      UPLOAD_DIR: /data/uploads
      API_PUBLIC_URL: https://${API_DOMAIN}
      # Cargo-owner Telegram notifications. Leave TELEGRAM_BOT_TOKEN empty to
      # keep the feature disabled (webhook returns 404, daily job no-ops).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_DAILY_HOUR_UTC: ${TELEGRAM_DAILY_HOUR_UTC:-3}
      # Owner alerts turn an in-app path into a link the owner can tap from
      # Telegram. Empty drops the link rather than shipping a broken href, so
      # alerts still work without it — they just lose the tap-through.
      PUBLIC_WEB_URL: https://${APP_DOMAIN}
      BRIEFING_HOUR_LOCAL: ${BRIEFING_HOUR_LOCAL:-7}
      # Optional, and everything that uses it degrades to something useful when
      # it is empty: the morning digest falls back to a plain templated one, the
      # question agent and the receipt scanner answer "not configured". Note
      # this also feeds the Reports page's AI generator, which never reached the
      # container before because this line did not exist.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        # Vite bakes these into the bundle at build time.
        VITE_API_URL: https://${API_DOMAIN:?set API_DOMAIN in .env.prod}
        VITE_WS_URL: wss://${API_DOMAIN}
    restart: unless-stopped
    environment:
      # Substituted into the nginx CSP connect-src at container start.
      API_ORIGIN: https://${API_DOMAIN}
      WS_ORIGIN: wss://${API_DOMAIN}
      PORT: "8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  caddydata:
  uploads:
  caddyconfig:
