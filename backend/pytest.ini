[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
# `live` tests reach the real CarGoRuqsat site. Excluded by default so the suite
# stays offline and deterministic; run them deliberately with `pytest -m live`
# (a trailing -m on the command line overrides this one) after touching the
# scraper, and periodically, since only they notice the site changing shape.
markers =
    live: hits an external site over the network
addopts = -ra --tb=short -m "not live"
