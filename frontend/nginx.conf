# nginx config for serving the Fleet Watch Pro SPA.
#
# Content-Security-Policy notes:
#   - The API origin in connect-src is driven by the ${API_ORIGIN} / ${WS_ORIGIN}
#     environment variables (substituted at container start). Set them to your
#     real API host when running the image; the Dockerfile ships safe defaults.
#   - 'unsafe-inline' is allowed for styles because Leaflet and several Radix UI
#     / shadcn components inject inline styles at runtime. Removing it would break
#     the map and various interactive components.
#   - OpenStreetMap tile servers are allowed under img-src so Leaflet maps render.

# NOTE: served via nginx's envsubst template mechanism so it can bind the
# platform-provided ${PORT} (Railway/Render inject it) and the CSP API origin.
# ${PORT}, ${API_ORIGIN} and ${WS_ORIGIN} are substituted from the environment
# (defaults set in the Dockerfile); nginx's own $uri/$host variables use no
# braces and are untouched.
server {
    listen       ${PORT};
    listen       [::]:${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- gzip ---------------------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header X-Frame-Options           "DENY"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    # Content-Security-Policy — connect-src API origin comes from the environment
    # (${API_ORIGIN}/${WS_ORIGIN}), so the same image serves any deployment.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ${API_ORIGIN} ${WS_ORIGIN}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- hashed static assets: cache aggressively ---------------------------
    # Vite emits content-hashed filenames under /assets, so they are safe to
    # cache for a year and are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Other static files with hashes / long-lived assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA history fallback ----------------------------------------------
    # index.html must never be cached, so clients always pick up new builds.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }
}
